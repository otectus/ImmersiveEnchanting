buildscript {
    repositories { maven { url = 'https://maven.minecraftforge.net/' }; mavenCentral() }
    dependencies { classpath 'org.spongepowered:mixingradle:0.7.38' }
}
plugins {
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '6.0.54'
}
apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group
base { archivesName = mod_archive }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    // Test-only agent mod (immersive_enchanting_smoketest): drives a dev client into a fresh flat world, opens a real
    // enchanting table, clicks offers, plays rituals with real key events, saves screenshots and smoketest-result.json,
    // then quits. It also registers a deliberately unusual test enchantment. Used by runClient -PsmokeTest. Never shipped.
    smokeTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods { immersive_enchanting { source sourceSets.main } }
        }
        client {
            if (project.hasProperty('smokeTest')) {
                property 'immersive_enchanting.smoketest.output', file('run/smoketest').absolutePath
                if (project.hasProperty('smokeExpect')) property 'immersive_enchanting.smoketest.expect', project.property('smokeExpect')
                mods { immersive_enchanting_smoketest { source sourceSets.smokeTest } }
            }
        }
        server { args '--nogui' }
        gameTestServer {
            workingDirectory project.file('run-gametest')
            mods { immersive_enchanting { source sourceSets.gameTest } }
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Pure ritual math (pattern generation, scoring, difficulty, outcome resolution) has no Minecraft imports,
    // so it is unit-tested with plain JUnit.
    // Apotheosis adapter (compat/apotheosis): compiled against its classes, reached only when Apotheosis is loaded.
    compileOnly fg.deobf("maven.modrinth:apotheosis:${apotheosis_modrinth_id}")
    compileOnly fg.deobf("maven.modrinth:placebo:${placebo_modrinth_id}")

    // Real enchanting-table mods for the compatibility runs (-PcompatMods=apotheosis or -PcompatMods=easymagic).
    // Easy Magic needs no compile-time dependency. Never part of a normal build.
    if (project.hasProperty('compatMods')) {
        def wanted = project.property('compatMods').toString().split(',')*.trim()
        if (wanted.contains('apotheosis')) {
            runtimeOnly fg.deobf("maven.modrinth:apotheosis:${apotheosis_modrinth_id}")
            runtimeOnly fg.deobf("maven.modrinth:placebo:${placebo_modrinth_id}")
            runtimeOnly fg.deobf("maven.modrinth:apothic-attributes:${apothic_attributes_modrinth_id}")
            runtimeOnly fg.deobf("maven.modrinth:patchouli:${patchouli_modrinth_id}")
        }
        if (wanted.contains('easymagic')) {
            runtimeOnly fg.deobf("maven.modrinth:easy-magic:${easy_magic_modrinth_id}")
            runtimeOnly fg.deobf("maven.modrinth:puzzles-lib:${puzzles_lib_modrinth_id}")
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter:${junit_version}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junit_platform_version}"
}

test {
    useJUnitPlatform()
    testLogging { events 'failed'; exceptionFormat 'full' }
}

tasks.named('processResources', ProcessResources).configure {
    def properties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                      mod_authors: mod_authors, minecraft_version_range: minecraft_version_range,
                      forge_version_range: forge_version_range, loader_version_range: loader_version_range]
    inputs.properties properties
    filesMatching('META-INF/mods.toml') { expand properties }
}

tasks.named('processSmokeTestResources', ProcessResources).configure {
    inputs.properties mod_version: mod_version, mod_license: mod_license
    filesMatching('META-INF/mods.toml') { expand mod_version: mod_version, mod_license: mod_license }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    manifest.attributes('Specification-Title': mod_id, 'Specification-Vendor': mod_authors,
                        'Specification-Version': '1', 'Implementation-Title': project.name,
                        'Implementation-Version': mod_version, 'Implementation-Vendor': mod_authors,
                        'MixinConfigs': "${mod_id}.mixins.json")
    finalizedBy 'reobfJar'
}
